name: libria

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-digitallibrary}
      MYSQL_USER: ${MYSQL_USER:-libria}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-libria_change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: apps/backend-spring
    environment:
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-digitallibrary}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:-libria}
      DB_PASSWORD: ${MYSQL_PASSWORD:-libria_change_me}
      SPRING_PROFILES_ACTIVE: prod
      SPRINGDOC_API_DOCS_ENABLED: "true"
      SPRINGDOC_SWAGGER_UI_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?AI_SERVICE_API_KEY must be set}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      EXPOSE_RESET_LINK: "false"
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-no-reply@libria.local}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: /api
        VITE_BACKEND_ORIGIN: ""
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.32.5
    profiles: [ai]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:0.32.5
    profiles: [ai]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen3.5:4b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  ai-service:
    build:
      context: apps/ai-service
    profiles: [ai]
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      OLLAMA_BASE_URL: http://ollama:11434
      BACKEND_BASE_URL: http://backend:8080
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?AI_SERVICE_API_KEY must be set}
      AI_UPLOAD_DIR: /app/backend-spring/uploads
      VECTOR_DB_PATH: /data/vector_db
      TOP_K: ${TOP_K:-5}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-1.1}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-240}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
    volumes:
      - uploads:/app/backend-spring/uploads:ro
      - vector_data:/data/vector_db
      - huggingface_cache:/data/huggingface
    depends_on:
      backend:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

volumes:
  mysql_data:
  uploads:
  ollama_data:
  vector_data:
  huggingface_cache:
