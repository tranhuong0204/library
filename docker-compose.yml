services:
  mysql:
    image: mysql:8.4
    container_name: libria-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: digitallibrary
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    container_name: libria-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-model:
    image: ollama/ollama:latest
    container_name: libria-ollama-model
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull $${OLLAMA_MODEL}"]
    restart: "no"
    volumes:
      - ollama-data:/root/.ollama

  backend:
    build: ./apps/backend-spring
    container_name: libria-backend
    restart: unless-stopped
    environment:
      # Development data is stored in the MySQL Server installed on Windows.
      # host.docker.internal lets the backend container reach that host database.
      DB_URL: jdbc:mysql://host.docker.internal:3306/digitallibrary?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?AI_SERVICE_API_KEY must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      EXPOSE_RESET_LINK: "false"
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-no-reply@libria.local}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./apps/backend-spring/uploads:/app/uploads

  ai-service:
    build: ./apps/ai-service
    container_name: libria-ai
    restart: unless-stopped
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      OLLAMA_BASE_URL: http://ollama:11434
      BACKEND_BASE_URL: http://backend:8080
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?AI_SERVICE_API_KEY must be set}
      AI_UPLOAD_DIR: /backend-spring/uploads
      VECTOR_DB_PATH: /app/vector_db
      TOP_K: ${TOP_K:-5}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-1.1}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-240}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
    depends_on:
      ollama-model:
        condition: service_completed_successfully
      backend:
        condition: service_started
    expose:
      - "8000"
    volumes:
      - ./apps/ai-service/vector_db:/app/vector_db
      - ./apps/backend-spring/uploads:/backend-spring/uploads
      - embedding-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 20

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    container_name: libria-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql-data:
  ollama-data:
  uploads-data:
  embedding-cache:
