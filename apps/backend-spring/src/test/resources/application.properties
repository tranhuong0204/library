spring.datasource.url=jdbc:h2:mem:libria_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
jwt.secret=test-only-secret-key-with-at-least-32-characters
jwt.expiration=3600000
ai.service.base-url=http://localhost:8000
ai.service.api-key=test-internal-api-key
spring.mail.host=localhost
app.mail.enabled=false
app.auth.expose-reset-link=false
