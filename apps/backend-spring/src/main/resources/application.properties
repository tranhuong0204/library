spring.application.name=backend-spring
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/digitallibrary?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Tranhuong222@}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jackson.time-zone=Asia/Ho_Chi_Minh

jwt.secret=${JWT_SECRET:ngocsome-spring-boot-react-mysql-secret-key-123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
ai.service.api-key=${AI_SERVICE_API_KEY:local-development-ai-key-change-me}

app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.mail.enabled=${MAIL_ENABLED:false}
app.auth.expose-reset-link=${EXPOSE_RESET_LINK:true}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:no-reply@libria.local}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:5000}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
